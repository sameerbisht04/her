<!DOCTYPE html>
<html lang="en">
<head>

    <title>Our Moments 💕</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <!-- Background stars -->
    <div class="stars"></div>

        <button id="musicBtn" class="music-btn" aria-label="Play music">
            <span class="music-icon">🎵</span>
        </button>
        <audio id="backgroundMusic" loop>
            <source src="photos/New folder/ytmp3free.cc_tera-rastaa-chhodoon-na-lyrical-video-chennai-express-shahrukh-khan-deepika-padukone-youtubemp3free.org.mp3" type="audio/mpeg">

    <section class="memories-section">
        <h2 class="memories-title">Our Moments 💕</h2>
        <div class="memories-gallery">
            <div class="memory-card">
                <img src="photos/WhatsApp Image 2026-02-13 at 1.04.16 PM.jpeg" alt="My favorite memory" class="gallery-photo">
                <p class="memory-caption">My favorite memory</p>
            </div>
            <div class="memory-card">
                <img src="photos/WhatsApp Image 2026-02-13 at 1.04.17 PM.jpeg" alt="I miss this day" class="gallery-photo">

            </div>
            <div class="memory-card">
                <img src="photos\WhatsApp Image 2026-02-13 at 1.03.51 PM.jpeg" alt="Memory" class="gallery-photo">

            </div>
            <div class="memory-card">
                <img src="photos\New folder\WhatsApp Image 2026-02-13 at 1.04.17 PM.jpeg" alt="Memory" class="gallery-photo">
                <p class="memory-caption">Perfect moments</p>
            </div>
        </div>
    </section>

    <!-- Navigation Buttons -->
    <section class="navigation-section">
        <button class="nav-btn prev-btn" onclick="window.location.href='apology.html'">
            <span>← Back</span>
        </button>
        <button class="nav-btn next-btn" onclick="window.location.href='dreams.html'">
            <span>Continue... →</span>
            <div class="btn-glow"></div>
        </button>

    <script src="script.js"></script>
