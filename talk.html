<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let me talk... 💕</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background stars -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <!-- Music Player -->
    <div class="music-player">
        <button id="musicBtn" class="music-btn" aria-label="Play music">
            <span class="music-icon">🎵</span>
        </button>
        <audio id="backgroundMusic" loop>
            <source src="photos/New folder/ytmp3free.cc_tera-rastaa-chhodoon-na-lyrical-video-chennai-express-shahrukh-khan-deepika-padukone-youtubemp3free.org.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Bear Section with Floating Hearts -->
    <section class="bear-section">
        <div class="bear-container">
            <!-- Floating Hearts Above Bear -->
            <div class="floating-heart heart1">💕</div>
            <div class="floating-heart heart2">💖</div>
            
            <!-- Cute Bear -->
            <div class="bear-wrapper">
                <div class="bear-character">🐻</div>
                <div class="bear-glow"></div>
            </div>
        </div>
    </section>

    <!-- Emotional Message Section -->
    <section class="talk-message-section">
        <div class="talk-message-container">
            <p class="talk-message-line1">It's late night... I've been walking for hours...</p>
            <p class="talk-message-line2">I'm holding something heavy... not in hands, but in heart...</p>
        </div>
    </section>

    <!-- Let me talk Button -->
    <section class="navigation-section">
        <button class="nav-btn talk-btn" onclick="window.location.href='sorry-letter.html'">
            <span>Let me talk...</span>
            <div class="btn-glow"></div>
        </button>
    </section>

    <script src="script.js"></script>
</body>
</html>
